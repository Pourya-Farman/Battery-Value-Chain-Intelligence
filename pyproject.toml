[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-value-chain"
version = "0.1.0"
description = "Synthetic battery value-chain data pipeline and Neo4j prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "neo4j>=5.26",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]